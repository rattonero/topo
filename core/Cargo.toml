[package]
name = "rattonero-core"
version = "0.1.0"
edition = "2021"
description = "Portable core of Rattonero Books: library scanning, EPUB parsing and sanitising."
license = "MIT OR Apache-2.0"

[lib]
name = "rattonero_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ammonia = "4.2.5"
deunicode = "1.6.2"
lopdf = { version = "0.47.0", default-features = false }
percent-encoding = "2.3.2"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = "0.32.2"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
