name: Rattonero
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rattonero:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Rattonero
      - path: Generated/RattoneroCore.swift
    dependencies:
      - framework: RattoneroCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Rattonero Books
        PRODUCT_MODULE_NAME: Rattonero
        # Placeholder identifier: change it to one you own before distributing.
        PRODUCT_BUNDLE_IDENTIFIER: com.rattonero.ebookreader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rattonero Books
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Rattonero/Rattonero.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        # The core is built for Apple-silicon simulators only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
