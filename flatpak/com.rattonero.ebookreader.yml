# Flatpak manifest for the GTK front end.
#
#     cargo xtask flatpak            # build and install for the current user
#     flatpak run com.rattonero.ebookreader
#
# `cargo xtask flatpak` first writes `cargo-sources.json` (every crate in
# Cargo.lock, so the build runs offline) next to this file.
#
# The app gets no network and no file system access of its own: the library
# folder comes through the file chooser portal, and links open in the
# browser through the OpenURI portal.
id: com.rattonero.ebookreader
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rattonero-books
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  # JPEG 2000, common in scanned PDFs.
  - name: openjpeg
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_CODEC=OFF
      - -DBUILD_TESTING=OFF
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/openjpeg-*
      - /lib/pkgconfig
      - /share
    sources:
      - type: archive
        url: https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz
        sha256: a695fbe19c0165f295a8531b1e4e855cd94d0875d2f88ec4b61080677e27188a

  # The GNOME runtime has no Poppler; build just the GLib binding.
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_GTK_DOC=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_UTILS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_LIBCURL=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.10.0.tar.xz
        sha256: 6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35

  - name: rattonero
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rattonero/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --package rattonero-gtk
      - install -Dm755 target/release/rattonero-books -t /app/bin
      - install -Dm644 gtk/data/com.rattonero.ebookreader.desktop -t /app/share/applications
      - install -Dm644 gtk/data/com.rattonero.ebookreader.metainfo.xml -t /app/share/metainfo
      - install -Dm644 gtk/data/com.rattonero.ebookreader.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 gtk/data/icons/hicolor/symbolic/apps/*.svg -t /app/share/icons/hicolor/symbolic/apps
      - install -Dm644 gtk/data/fonts.conf /app/etc/fonts/local.conf
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - apple
          - .git
          - .flatpak-builder
          - flatpak/.flatpak-builder
      - cargo-sources.json
