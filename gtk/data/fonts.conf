<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed as /app/etc/fonts/local.conf, which the GNOME runtime's
  fonts.conf includes; /app is also visible inside WebKit's web process
  sandbox, so this applies there too.

  WOFF and WOFF2 are web font formats. Some systems keep them in font
  directories (KaTeX does), and a host fontconfig cache may describe them
  without a family name. Skia's font manager, which WebKit uses, then spins
  for minutes per font on start-up, so no book page ever loads. Books' own
  fonts arrive through @font-face and are unaffected.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
